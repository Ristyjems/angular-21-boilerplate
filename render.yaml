services:
  # Backend Node.js API
  - type: web
    name: ipt-2026-backend
    env: node
    rootDir: backend
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production

  # Frontend Angular App
  - type: web
    name: ipt-2026-frontend
    env: static
    rootDir: ipt-2026-frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist/ipt-2026-frontend
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
